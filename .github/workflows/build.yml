name: Build and release ISFLab
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            artifact: macOS-arm64
          - runner: windows-latest
            artifact: Windows-x64
          - runner: ubuntu-latest
            artifact: Linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install macOS Qt
        if: runner.os == 'macOS'
        run: brew install qtbase
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        if: runner.os != 'macOS'
        with:
          version: '6.8.3'
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || 'linux_gcc_64' }}
          cache: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 xvfb xauth \
            libgl1-mesa-dri libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-bad
      - name: Configure
        shell: bash
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+(\.[0-9]+)?)([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Expected a release tag such as v0.0.1" >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            if [[ -z "${BASH_REMATCH[2]}" ]]; then version="$version.0"; fi
            args+=("-DISFLAB_BUILD_VERSION=$version")
          fi
          case "$RUNNER_OS" in
            macOS)
              qt_prefix="$(brew --prefix qtbase)"
              args+=("-DCMAKE_PREFIX_PATH=$qt_prefix" "-DISFLAB_MACOS_DEPLOY_LIBPATH=$qt_prefix/lib")
              ;;
            Linux) args+=(-DISFLAB_TEST_OPENGL=ON) ;;
          esac
          cmake -S . -B build-ci "${args[@]}"
      - run: cmake --build build-ci --config Release --parallel
      - if: runner.os != 'Linux'
        run: ctest --test-dir build-ci -C Release --output-on-failure
      - if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build-ci -C Release --output-on-failure
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: cmake --install build-ci --config Release --prefix "${{ github.workspace }}/package"
      - name: Sign and archive macOS bundle
        if: runner.os == 'macOS'
        run: |
          app=package/ISFLab.app
          exe="$app/Contents/MacOS/ISFLab"
          file "$exe" | grep -q arm64
          test -f "$app/Contents/PlugIns/platforms/libqcocoa.dylib"
          # ISFLab does not use PDF/SVG image plugins or the Qt virtual keyboard.
          rm -f "$app/Contents/PlugIns/imageformats/libqpdf.dylib" \
            "$app/Contents/PlugIns/imageformats/libqsvg.dylib" \
            "$app/Contents/PlugIns/iconengines/libqsvgicon.dylib" \
            "$app/Contents/PlugIns/platforminputcontexts/libqtvirtualkeyboardplugin.dylib"
          while IFS= read -r -d '' binary; do
            file "$binary" | grep -q Mach-O || continue
            install_id="$(otool -D "$binary" | sed -n '2p')"
            if otool -L "$binary" | awk -v id="$install_id" 'NR > 1 && $1 != id {print $1}' |
              grep -E '/opt/homebrew/|/usr/local/(Cellar|opt)/'; then
              echo "Unbundled dependency in $binary" >&2
              exit 1
            fi
            while IFS= read -r dependency; do
              if [[ ! -e "$app/Contents/Frameworks/${dependency#@rpath/}" ]]; then
                echo "Missing bundle dependency $dependency in $binary" >&2
                exit 1
              fi
            done < <(otool -L "$binary" | awk -v id="$install_id" 'NR > 1 && $1 != id && $1 ~ /^@rpath\// {print $1}')
            codesign --force --sign - "$binary"
          done < <(find "$app/Contents" -type f -print0)
          while IFS= read -r -d '' bundle; do
            codesign --force --sign - "$bundle"
          done < <(find "$app/Contents" -depth -type d \( -name '*.framework' -o -name '*.bundle' -o -name '*.app' \) -print0)
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" ISFLab-macOS-arm64.zip
      - name: Include the Microsoft Visual C++ runtime installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = "package/vc_redist.x64.exe"
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile $runtime
          $signature = Get-AuthenticodeSignature $runtime
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "Invalid Microsoft Visual C++ Redistributable signature"
          }
          $qtPlatform = Get-ChildItem package -Recurse -File -Filter qwindows.dll | Select-Object -First 1
          if (!(Test-Path package/bin/ISFLab.exe) -or !$qtPlatform) {
            throw "The Windows executable or Qt platform plugin is missing"
          }
      - name: Archive Windows executable and Qt libraries
        if: runner.os == 'Windows'
        run: Compress-Archive -Path package/* -DestinationPath ISFLab-Windows-x64.zip
      - name: Archive Linux executable
        if: runner.os == 'Linux'
        run: tar -C package -czf ISFLab-Linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: ISFLab-${{ matrix.artifact }}
          path: |
            ISFLab-*.zip
            ISFLab-*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ISFLab-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(release/ISFLab-macOS-arm64.zip release/ISFLab-Windows-x64.zip release/ISFLab-Linux-x64.tar.gz)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${flags[@]}" \
              --verify-tag --generate-notes --title "ISFLab $RELEASE_TAG" "${assets[@]}"
          fi


  release-metadata:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/release-metadata.yml
