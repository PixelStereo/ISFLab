name: Build and release ISFLab
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            artifact: macOS-arm64
          - runner: windows-latest
            artifact: Windows-x64
          - runner: ubuntu-latest
            artifact: Linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install macOS Qt
        if: runner.os == 'macOS'
        run: brew install qt
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        if: runner.os != 'macOS'
        with:
          version: '6.8.3'
          modules: qtmultimedia
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || 'linux_gcc_64' }}
          cache: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 xvfb xauth \
            libgl1-mesa-dri libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-bad
      - name: Release file suffix
        shell: bash
        run: |
          suffix=""
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then suffix="-$GITHUB_REF_NAME"; fi
          echo "TAG_SUFFIX=$suffix" >> "$GITHUB_ENV"
      - name: Configure
        shell: bash
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+(\.[0-9]+)?)([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Expected a release tag such as v0.0.1" >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            if [[ -z "${BASH_REMATCH[2]}" ]]; then version="$version.0"; fi
            args+=("-DISFLAB_TAG_VERSION=$version")
          fi
          case "$RUNNER_OS" in
            macOS)
              qt_prefix="$(brew --prefix qt)"
              args+=("-DCMAKE_PREFIX_PATH=$qt_prefix" "-DISFLAB_MACOS_DEPLOY_LIBPATH=$qt_prefix/lib")
              ;;
            Linux) args+=(-DISFLAB_TEST_OPENGL=ON) ;;
          esac
          cmake -S . -B build-ci "${args[@]}"
      - run: cmake --build build-ci --config Release --parallel
      - if: runner.os != 'Linux'
        run: ctest --test-dir build-ci -C Release --output-on-failure
      - if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build-ci -C Release --output-on-failure
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: cmake --install build-ci --config Release --prefix "${{ github.workspace }}/package"
      - name: Sign and archive macOS bundle
        if: runner.os == 'macOS'
        run: |
          app_name="$(python3 -c 'import json; print(json.load(open("build-ci/application.json"))["name"])')"
          app="package/$app_name.app"
          exe="$app/Contents/MacOS/$app_name"
          file "$exe" | grep -q arm64
          test -f "$app/Contents/PlugIns/platforms/libqcocoa.dylib"
          # ISFLab does not use PDF/SVG image plugins or the Qt virtual keyboard.
          rm -f "$app/Contents/PlugIns/imageformats/libqpdf.dylib" \
            "$app/Contents/PlugIns/imageformats/libqsvg.dylib" \
            "$app/Contents/PlugIns/iconengines/libqsvgicon.dylib" \
            "$app/Contents/PlugIns/platforminputcontexts/libqtvirtualkeyboardplugin.dylib"
          while IFS= read -r -d '' binary; do
            file "$binary" | grep -q Mach-O || continue
            install_id="$(otool -D "$binary" | sed -n '2p')"
            if otool -L "$binary" | awk -v id="$install_id" 'NR > 1 && $1 != id {print $1}' |
              grep -E '/opt/homebrew/|/usr/local/(Cellar|opt)/'; then
              echo "Unbundled dependency in $binary" >&2
              exit 1
            fi
            while IFS= read -r dependency; do
              if [[ ! -e "$app/Contents/Frameworks/${dependency#@rpath/}" ]]; then
                echo "Missing bundle dependency $dependency in $binary" >&2
                exit 1
              fi
            done < <(otool -L "$binary" | awk -v id="$install_id" 'NR > 1 && $1 != id && $1 ~ /^@rpath\// {print $1}')
            codesign --force --sign - "$binary"
          done < <(find "$app/Contents" -type f -print0)
          while IFS= read -r -d '' bundle; do
            codesign --force --sign - "$bundle"
          done < <(find "$app/Contents" -depth -type d \( -name '*.framework' -o -name '*.bundle' -o -name '*.app' \) -print0)
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "ISFLab-macOS-arm64${TAG_SUFFIX}.zip"
      - name: Bundle Windows runtime DLLs alongside ISFLab
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "package/bin"
          $appName = (Get-Content build-ci/application.json | ConvertFrom-Json).name
          Rename-Item (Join-Path $bin "ISFLab.exe") "$appName.exe"
          $crt = Get-ChildItem (Join-Path $env:VCToolsRedistDir "x64") -Directory -Filter "Microsoft.VC*.CRT" |
            Select-Object -First 1
          if (!$crt) { throw "Microsoft Visual C++ runtime DLLs are missing from the build environment" }
          Copy-Item (Join-Path $crt.FullName "*.dll") -Destination $bin -Force -ErrorAction Stop
          $qtPlatform = Get-ChildItem package -Recurse -File -Filter qwindows.dll | Select-Object -First 1
          $appExe = "$appName.exe"
          foreach ($file in @($appExe, "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            if (!(Test-Path (Join-Path $bin $file))) { throw "Missing portable Windows dependency: $file" }
          }
          if (!$qtPlatform) { throw "The Qt Windows platform plugin is missing" }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }
          $compiler = Join-Path ${env:ProgramFiles(x86)} "NSIS/makensis.exe"
          $app = Get-Content build-ci/application.json | ConvertFrom-Json
          & $compiler "/DTAG_SUFFIX=$env:TAG_SUFFIX" "/DAPP_NAME=$($app.name)" "/DAPP_EXE=$($app.name).exe" packaging/windows.nsi
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "ISFLab-Windows-x64$env:TAG_SUFFIX-Setup.exe")) {
            throw "Windows installer build failed"
          }
      - name: Archive Linux executable
        if: runner.os == 'Linux'
        run: tar -C package -czf "ISFLab-Linux-x64${TAG_SUFFIX}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: ISFLab-${{ matrix.artifact }}
          path: |
            ISFLab-*.zip
            ISFLab-*.tar.gz
            ISFLab-Windows-x64*-Setup.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ISFLab-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=("release/ISFLab-macOS-arm64-$RELEASE_TAG.zip" "release/ISFLab-Windows-x64-$RELEASE_TAG-Setup.exe" "release/ISFLab-Linux-x64-$RELEASE_TAG.tar.gz")
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${flags[@]}" \
              --verify-tag --generate-notes --title "ISFLab $RELEASE_TAG" "${assets[@]}"
          fi


  release-metadata:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/release-metadata.yml
