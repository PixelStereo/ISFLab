name: Release downloads
on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [published, edited, deleted, unpublished]

permissions:
  contents: write

concurrency:
  group: release-downloads
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Update downloads and version on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "$DEFAULT_BRANCH"
            git reset --hard FETCH_HEAD
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              python3 .github/scripts/release_downloads.py "$GITHUB_REPOSITORY"
            if git diff --quiet -- README.md VERSION; then exit 0; fi
            git add README.md VERSION
            git commit -m 'chore: synchronize ISFLab release version and downloads'
            if git push origin "HEAD:$DEFAULT_BRANCH"; then exit 0; fi
          done
          exit 1
